spring:
  application:
    name: productos

  datasource:
    url: jdbc:postgresql://localhost:5432/cafeteria_product
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082
  servlet:
    context-path: /api
